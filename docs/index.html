<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prospection" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Prospection</title>
    <link rel="stylesheet" href="app.css?v=2026-11-19-e1aff171" />
    <script>
      // Couleur du thème choisi, appliquée avant l'affichage (voir src/theme.js)
      try {
        var t = JSON.parse(localStorage.getItem('prospection-theme') || 'null');
        if (t && t.vars) {
          for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]);
          document.documentElement.dataset.theme = t.id;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t.vars['--head']);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div id="banner" hidden></div>
      <main id="tabs">
        <section id="tab-carte" class="tab tab-map active" data-tab="carte"></section>
        <section id="tab-contacts" class="tab" data-tab="contacts"></section>
        <section id="tab-relances" class="tab" data-tab="relances"></section>
        <section id="tab-scenarios" class="tab" data-tab="scenarios"></section>
        <section id="tab-bord" class="tab" data-tab="bord"></section>
      </main>
      <nav id="tabbar" aria-label="Onglets"></nav>
    </div>
    <div id="pages"></div>
    <div id="sheet-root"></div>
    <div id="dialog-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="boot">
      <div class="boot-logo"></div>
      <p id="boot-msg">Chargement…</p>
    </div>
    <script type="module" src="app.js?v=2026-11-19-e1aff171"></script>
  </body>
</html>
