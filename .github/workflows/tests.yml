# Tests automatiques à chaque demande de fusion (D-021) et à chaque arrivée sur recette.
# Résultat dans l'onglet « Checks » de la demande de fusion. La Recette, elle, est construite et publiée
# par Cloudflare depuis la branche recette (D-020) : on n'y fusionne qu'avec des tests au vert.
name: Tests

on:
  pull_request:
  push:
    branches: [recette]
  workflow_dispatch: # relance manuelle depuis l'onglet Actions

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: |
          npm ci --no-audit --no-fund
          pip install msoffcrypto-tool olefile
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui > /dev/null

      - name: Construire la prod et la Recette
        run: |
          npm run build
          npm run build:recette

      - name: Lancer les séries
        run: |
          echo "Chrome : $(/usr/bin/google-chrome --version)"
          echec=0
          for serie in smoke flow flow2 oldpassage rgpd sauvegarde "theme plein" "theme bande" officecrypto dvf recette; do
            set -- $serie
            echo "::group::$serie"
            if node "tests/$1.mjs" ${2:-}; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::Série en échec : $serie"; echec=1; fi
          done
          exit $echec

      - name: Garder les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/shots/
          retention-days: 7
